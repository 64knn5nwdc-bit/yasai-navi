<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#247a4c"><link rel="manifest" href="./manifest.webmanifest"><title>野菜最安ナビ</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f8f4;color:#183a28}header{background:#247a4c;color:white;padding:20px 16px}h1{margin:0 0 6px;font-size:24px}main{max-width:680px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:15px;margin:11px 0;box-shadow:0 2px 8px #0001}.notice{background:#fff3d4;padding:12px;border-radius:10px;font-size:14px}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button{flex:1;min-width:125px}.source-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.source-links a{padding:10px 12px;border:1px solid #b6cbbd;border-radius:9px;text-decoration:none}.badge{display:inline-block;background:#edf5ef;padding:3px 8px;border-radius:6px;margin:8px 0;font-size:12px}button,select,input{font:inherit;padding:10px;border:1px solid #b6cbbd;border-radius:9px;background:white;color:#183a28}button{cursor:pointer}.tabs button.active,.primary{background:#247a4c;color:white;border:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.price{font-size:24px;color:#247a4c;font-weight:800}.small{font-size:12px;color:#64766b}a{color:#1c6e42}details{margin-top:10px}li{margin:8px 0}.empty{padding:16px;text-align:center;color:#64766b}input{width:90%}</style></head><body><header><h1>🥬 野菜最安ナビ</h1><div>白山市周辺の公開特売情報</div></header><main><div id="status" class="notice">価格データを読み込んでいます…</div><div class="card"><div class="tabs"><button id="pricesTab" onclick="setTab('prices')">価格比較</button><button id="storesTab" onclick="setTab('stores')">店舗別</button><button id="sourcesTab" onclick="setTab('sources')">チラシ・参照元</button><button id="cartTab" onclick="setTab('cart')">買い物リスト</button></div></div><div id="view"></div></main><script>
const veggies=[['cabbage','キャベツ'],['onion','玉ねぎ'],['negi','ねぎ'],['carrot','にんじん'],['potato','じゃがいも'],['daikon','大根'],['tomato','トマト'],['cucumber','きゅうり'],['hakusai','白菜'],['komatsuna','小松菜'],['spinach','ほうれん草']];
let collectionStatus=null;let stores=[],prices=[],updatedAt=null,tab='prices',selectedStore='',query='';let cart=[];try{cart=JSON.parse(localStorage.getItem('yasai-cart-ids')||'[]')}catch{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'未更新';
function valid(p){if(p?.tax_included!==true||p?.verification_method!=="manual_source_review"||!p?.evidence_text?.trim()||!p?.conditions?.trim()||!p?.valid_from||!/^https:\/\/[^/]+\//.test(p?.source_url||""))return false;const checked=new Date(p.verified_at);if(isNaN(checked)||checked>new Date()||!/(Z|[+-]\d{2}:\d{2})$/.test(p.verified_at))return false;if(!p||!Number.isFinite(p.price_yen)||p.price_yen<=0||!p.verified_at||!p.valid_until||!p.source_url||!p.unit||!p.vegetable_id||!p.store_id)return false;const end=new Date(p.valid_until+'T23:59:59+09:00');const start=p.valid_from?new Date(p.valid_from+'T'+(p.valid_from_time||'00:00')+':00+09:00'):null;return !isNaN(end)&&end>=new Date()&&(!start||start<=new Date())&&stores.some(s=>s.id===p.store_id)&&veggies.some(v=>v[0]===p.vegetable_id)}
function rows(id){return prices.filter(p=>p.vegetable_id===id).sort((a,b)=>a.price_yen-b.price_yen)}
function comparable(a){return new Set(a.map(p=>JSON.stringify([p.unit,p.conditions]))).size<=1} function storeName(id){return stores.find(s=>s.id===id)?.name||id}
function setTab(t){tab=t;render()}function toggle(id){cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];localStorage.setItem('yasai-cart-ids',JSON.stringify(cart));render()}
function priceRow(p){return '<div class="row"><div><b>'+esc(storeName(p.store_id))+'</b><div class="small">'+esc(p.unit)+'・税込 / '+esc(p.valid_from)+(p.valid_from_time?' '+esc(p.valid_from_time):'')+'〜'+esc(p.valid_until)+'まで</div></div><span class="price">¥'+p.price_yen.toLocaleString('ja-JP')+'</span></div><div class="small">条件：'+esc(p.conditions)+'<br>確認：'+esc(fmt(p.verified_at))+'　<a href="'+esc(p.source_url)+'" target="_blank" rel="noopener noreferrer">出典を確認</a></div>'}

function safeSourceUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password?u.href:null}catch{return null}}
function sourceLinks(s){return (Array.isArray(s.reference_links)?s.reference_links:[]).map(l=>{const u=safeSourceUrl(l.url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label)+' ↗</a>':''}).join('')}
function collectorNote(s){if(s.id!=='yamakishi'||!collectionStatus)return '';const c=collectionStatus;const state=c.status==='candidates_ready'?'チラシ画像 '+Number(c.image_count||0)+'枚から野菜名の候補 '+Number(c.candidate_count||0)+'件を自動読取（未確認・価格には未反映）':c.status==='no_current_flyer'?'対象チラシの掲載期間外':'自動読取を停止。参照元の確認が必要です。';return '<p class="small">'+esc(state)+'<br>読取確認：'+esc(fmt(c.checked_at))+'<br>OCRだけでは価格・数量・商品別販売日を確定できないため、原本確認が必要です。</p>'}
function sourceCard(s){if(!s)return '';const directory=s.kind==='directory';const count=prices.filter(p=>p.store_id===s.id).length;return '<section class="card"><h2 style="font-size:18px;margin:0">'+esc(s.name)+'</h2><span class="badge">'+(directory?'店舗検索':count?'確認済み価格 '+count+'件':'価格未確認')+'</span>'+(s.address?'<p class="small">'+esc(s.address)+'</p>':'')+'<div class="source-links">'+sourceLinks(s)+'</div><p>'+esc(s.collection_note||'価格取得状況は未確認です。')+'</p>'+collectorNote(s)+(s.id==='yamakishi'?'<p><a href="./review.html">候補を原本と照合（確認用） →</a></p>':'')+'<p class="small">'+esc(s.travel_time_status||'車で約20分圏内か未確認')+'<br>参照元の調査日：'+esc(s.source_checked_on||'未確認')+'（価格の確認日とは異なります）</p></section>'}
function renderSources(){const real=stores.filter(s=>s.kind!=='directory'),dirs=stores.filter(s=>s.kind==='directory');return '<div class="card"><h2>チラシ・参照元</h2><p>公式参照元 '+real.length+'店舗。価格がない店舗も、ここからチラシや店舗情報を確認できます。</p><p class="small">リンクの登録は自動価格収集の対応完了を意味しません。販売対象店舗・販売日・数量・購入条件は原本を確認してください。車で約20分以内かは各候補とも未確認です。</p></div>'+real.map(sourceCard).join('')+(dirs.length?'<h2>店舗を探す</h2>'+dirs.map(sourceCard).join(''):'')}

function render(){for(const t of ['prices','stores','sources','cart'])document.getElementById(t+'Tab').className=tab===t?'active':'';const v=document.getElementById('view');if(tab==='sources'){v.innerHTML=renderSources();return}if(tab==='prices'){v.innerHTML='<div class="card"><input placeholder="野菜を検索" value="'+esc(query)+'" oninput="query=this.value;renderResults()"></div><div id="results"></div>';renderResults()}else if(tab==='stores'){if(!stores.length){v.innerHTML='<div class="card empty">店舗情報がまだありません</div>';return}if(!selectedStore)selectedStore=stores[0].id;v.innerHTML='<div class="card"><select onchange="selectedStore=this.value;render()">'+stores.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selectedStore?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>'+sourceCard(stores.find(s=>s.id===selectedStore))+((a)=>a.length?a.map(p=>'<div class="card"><b>'+esc(veggies.find(x=>x[0]===p.vegetable_id)?.[1])+'</b>'+priceRow(p)+'</div>').join(''):'<div class="card empty">現在確認できる価格はありません</div>')(prices.filter(p=>p.store_id===selectedStore))}else{v.innerHTML='<div class="card"><h2>買い物リスト</h2>'+(cart.length?cart.map(id=>{const name=veggies.find(v=>v[0]===id)?.[1]||id;const a=rows(id);return '<div class="row"><div><b>'+esc(name)+'</b><div class="small">'+(a.length&&comparable(a)?'¥'+a[0].price_yen+' / '+esc(a[0].unit)+' / '+esc(storeName(a[0].store_id)):'価格未確認')+'</div></div><button onclick="toggle(\''+id+'\')">削除</button></div><hr>'}).join(''):'価格比較から野菜を追加してください')+'<p class="small">数量単位が異なる商品は最安を選びません。産地・サイズなどの条件も出典で確認してください。</p><button onclick="copyList()">リストをコピー</button></div>'}}
function renderResults(){const el=document.getElementById('results');if(!el)return;el.innerHTML=veggies.filter(v=>v[1].includes(query)).map(([id,name])=>{const a=rows(id),p=a[0],same=comparable(a);return '<div class="card"><div class="row"><div><b>'+esc(name)+'</b><div class="small">'+(p?esc(storeName(p.store_id))+' / '+esc(p.unit):'現在の確認済み価格なし')+'</div></div><div class="price">'+(p?(same?'¥'+p.price_yen.toLocaleString('ja-JP'):'単位別に確認'):'未確認')+'</div></div>'+(p?'<div class="small">※掲載商品の容量・数量が異なる場合は比較に注意</div><details><summary>確認済みの価格 '+a.length+'件</summary>'+a.map(x=>'<hr>'+priceRow(x)).join('')+'</details>':'')+'<p><button class="primary" onclick="toggle(\''+id+'\')">'+(cart.includes(id)?'✓ リストから外す':'＋ 買い物リストへ')+'</button></p></div>'}).join('')||'<div class="card empty">該当する野菜がありません</div>'}
function copyList(){const s=cart.map(id=>{const a=rows(id),p=comparable(a)?a[0]:null,name=veggies.find(v=>v[0]===id)?.[1]||id;return name+(p?' ¥'+p.price_yen+' ('+p.unit+'・'+storeName(p.store_id)+')':' 価格未確認')}).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(s)}
async function fetchData(name){const allowed=['stores.json','prices.json','collection_status.json'];if(!allowed.includes(name))throw Error('対象外のデータ');const response=await fetch('https://raw.githubusercontent.com/64knn5nwdc-bit/yasai-navi/main/'+name,{cache:'no-store'}).catch(()=>null);return response&&response.ok?response:fetch('./'+name,{cache:'no-store'})}
async function load(){try{collectionStatus=await fetchData('collection_status.json').then(r=>r.ok?r.json():null).catch(()=>null);const [s,p]=await Promise.all([fetchData('stores.json'),fetchData('prices.json')]);if(!s.ok||!p.ok)throw Error('データファイルが見つかりません');const sj=await s.json(),pj=await p.json();stores=Array.isArray(sj.stores)?sj.stores:[];updatedAt=pj.updated_at;prices=(Array.isArray(pj.prices)?pj.prices:[]).filter(valid);document.getElementById('status').innerHTML='<b>確認済み価格：'+prices.length+'件</b> / データ更新：'+esc(fmt(updatedAt))+'<br>ヤマキシのチラシを自動読取しています。価格の掲載には原本確認が必要です。出典・税込価格・数量単位・期限を確認できた商品のみ掲載します。対象店舗の車で約20分圏内かは未確認です。未掲載の商品は価格未確認です。';}catch(e){document.getElementById('status').textContent='価格データを取得できませんでした。通信状態を確認して再読み込みしてください。';stores=[];prices=[]}render()};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
