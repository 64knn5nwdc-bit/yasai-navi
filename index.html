<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#247a4c"><link rel="manifest" href="manifest.webmanifest"><title>野菜最安ナビ</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f8f4;color:#183a28}header{background:#247a4c;color:white;padding:22px 18px}main{max-width:650px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}.notice{background:#fff3d4;padding:12px;border-radius:10px;font-size:13px}button,select,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #ccd9ce}button{background:#247a4c;color:white;border:0;cursor:pointer}.tabs{display:flex;gap:6px}.tabs button{flex:1;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:800;font-size:23px;color:#247a4c}.small{font-size:12px;color:#64766b}details{margin-top:10px}li{margin:8px 0}#view{margin-top:12px}</style></head><body><header><h1>🥬 野菜最安ナビ</h1><div>白山市源兵島町・車で約20分圏内を想定</div></header><main><div class="notice"><b>デモ版：すべて架空のサンプル価格です。</b><br>実際のチラシ価格・在庫・店舗までの所要時間を保証しません。自動更新機能はまだありません。</div><div class="card"><div class="tabs"><button onclick="tab='prices';render()">価格比較</button><button onclick="tab='stores';render()">店舗別</button><button onclick="tab='cart';render()">買い物リスト</button></div></div><div id="view"></div></main><script>const stores=['ゲンキー','クスリのアオキ','ヤマキシ辰口','イオン松任','Aコープ北安田','JAまいどさん市場','バロー松任','業務スーパー松任'];const data=[['キャベツ','1玉',[128,138,148,118,158,135,148,139]],['玉ねぎ','3個',[138,128,148,158,148,118,138,129]],['にんじん','3本',[118,128,138,148,128,108,138,119]],['じゃがいも','1袋',[178,168,158,188,178,148,168,159]],['大根','1本',[148,138,158,128,138,118,148,149]],['トマト','1個',[98,108,118,88,108,95,98,99]],['きゅうり','3本',[148,138,158,168,148,128,138,149]],['白菜','1/4玉',[98,88,108,98,78,88,98,99]],['小松菜','1束',[98,108,118,108,98,78,108,99]],['ほうれん草','1束',[148,138,158,148,138,118,148,139]]];let tab='prices',selectedStore=0,cart=JSON.parse(localStorage.getItem('yasai-cart')||'[]');function toggle(i){cart=cart.includes(i)?cart.filter(x=>x!==i):[...cart,i];localStorage.setItem('yasai-cart',JSON.stringify(cart));render()}function render(){const v=document.getElementById('view');if(tab==='prices'){v.innerHTML='<div class="card"><input id="q" placeholder="野菜を検索" oninput="filter()" style="width:90%"></div><div id="results"></div>';filter()}else if(tab==='stores'){v.innerHTML='<div class="card"><select onchange="selectedStore=+this.value;render()">'+stores.map((s,i)=>`<option value="${i}" ${i===selectedStore?'selected':''}>${s}</option>`).join('')+'</select></div>'+data.map(d=>`<div class="card row"><span>${d[0]} <span class="small">${d[1]}</span></span><b>¥${d[2][selectedStore]}</b></div>`).join('')}else{let total=cart.reduce((sum,i)=>sum+Math.min(...data[i][2]),0);v.innerHTML='<div class="card"><h2>買い物リスト</h2>'+ (cart.length?cart.map(i=>`<div class="row"><span>${data[i][0]}（${data[i][1]}）<div class="small">${stores[data[i][2].indexOf(Math.min(...data[i][2]))]}</div></span><span>¥${Math.min(...data[i][2])} <button onclick="toggle(${i})">削除</button></span></div><hr>`).join('')+`<h2>合計 ¥${total}</h2><div class="small">各品目の最安店を回った場合。交通費は含みません。</div><button onclick="copyList()">リストをコピー</button>`:'野菜を追加してください')+'</div>'}}function filter(){let q=document.getElementById('q').value;document.getElementById('results').innerHTML=data.map((d,i)=>({d,i})).filter(x=>x.d[0].includes(q)).map(({d,i})=>{let p=Math.min(...d[2]),idx=d[2].indexOf(p);return `<div class="card"><div class="row"><div><b>${d[0]}</b><div class="small">${d[1]}・${stores[idx]}</div></div><div class="price">¥${p}</div></div><div class="small">サンプル価格</div><details><summary>全8店舗を比較</summary><ol>${d[2].map((price,j)=>({price,j})).sort((a,b)=>a.price-b.price).map(x=>`<li>${stores[x.j]}：¥${x.price}</li>`).join('')}</ol></details><p><button onclick="toggle(${i})">${cart.includes(i)?'✓ 追加済み（解除）':'＋ リストに追加'}</button></p></div>`}).join('')}function copyList(){navigator.clipboard?.writeText(cart.map(i=>`${data[i][0]} ${data[i][1]} ¥${Math.min(...data[i][2])} ${stores[data[i][2].indexOf(Math.min(...data[i][2]))]}`).join('\n')+'\n※架空のサンプル価格です')}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>
