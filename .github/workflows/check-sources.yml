name: Check vegetable flyer sources

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0,2,4'

permissions:
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check official sources
        run: python check_sources.py
